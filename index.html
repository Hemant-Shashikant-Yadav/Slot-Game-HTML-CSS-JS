<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slot Game</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>🎰 Slot Game 🎰</h1>
      <div class="info">
        <p id="coins-display">Available Coins: 100</p>
        <p id="bet-display">Current Bet: 10</p>
      </div>
      <div class="slots">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
      </div>
      <div class="controls">
        <button id="decrease-bet">-</button>
        <button id="spin-button">Spin</button>
        <button id="increase-bet">+</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
